[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "sandboxed-code-agent"
version = "0.1.0"
description = "Local-model Python code generation with restricted Docker execution and verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "docker>=7.1,<8",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
sandbox-agent = "sandbox_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_agent"]
